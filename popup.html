<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #fff;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 14px;
        color: #161823;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        object-fit: cover;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-bottom: 8px;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.15s,
          transform 0.15s,
          background 0.15s;
      }
      button:hover:not(:disabled) {
        opacity: 0.92;
        transform: translateY(-1px);
      }
      button:active:not(:disabled) {
        opacity: 0.82;
        transform: translateY(0);
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
        transform: none;
      }
      .task-button {
        background: #1677ff;
      }
      .task-button.running {
        position: relative;
        overflow: hidden;
        opacity: 1;
        background: linear-gradient(90deg, #1677ff, #4096ff, #1677ff);
        background-size: 200% 100%;
        animation: runningPulse 1.1s linear infinite;
      }
      .task-button.running::before {
        content: "";
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 7px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #fff;
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.7s linear infinite;
      }
      .stop-button {
        background: #ff3b30;
      }
      .config-button {
        background: #eef1f5;
        color: #161823;
      }
      .stop-button:disabled {
        background: #d9d9d9;
        color: #8c8c8c;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes runningPulse {
        0% {
          background-position: 0% 50%;
        }
        100% {
          background-position: 200% 50%;
        }
      }
      .status {
        font-size: 11px;
        color: #888;
        margin-top: 6px;
        padding: 6px 8px;
        background: #f8f8f8;
        border-radius: 4px;
        word-break: break-word;
      }
      .hint {
        font-size: 10px;
        color: #aaa;
        margin-top: 10px;
        line-height: 1.4;
      }
      .engine-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        padding: 8px 10px;
        background: #f8f8f8;
        border-radius: 6px;
      }
      .engine-label {
        font-size: 12px;
        color: #666;
        font-weight: 600;
      }
      .engine-select {
        flex: 1;
        padding: 5px 8px;
        border: 1px solid #d9d9d9;
        border-radius: 5px;
        font-size: 12px;
        background: #fff;
        cursor: pointer;
      }
      .divider {
        height: 1px;
        background: #f1f1f2;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <h1>
      <img class="logo" src="icons/icon32.png" alt="LIVE Backstage" />
      TikTok Live Automation
    </h1>

    <div class="engine-row">
      <label class="engine-label">エンジン:</label>
      <select id="engineSelect" class="engine-select">
        <option value="dom">DOM</option>
        <option value="agent">Agent</option>
      </select>
    </div>

    <button id="btnGetCreator" class="task-button" data-task="getCreator">
      1. クリエイター取得
    </button>
    <button id="btnInvite" class="task-button" data-task="invite">
      2. 招待チェック
    </button>
    <button id="btnSend" class="task-button" data-task="sendMessage">
      3. メッセージ送信
    </button>

    <div class="divider"></div>
    <button id="btnConfig" class="config-button">設定</button>
    <button id="btnStop" class="stop-button" disabled>停止</button>

    <div class="status" id="status">準備完了 — タスクをクリックして開始</div>
    <div class="hint">
      TikTok Backstage にログインしていることを確認してください。<br />
      loopSize / msg / sent は拡張機能のローカル設定に保存されます。
    </div>

    <script src="popup.js"></script>
  </body>
</html>
